<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AACM Recall</title>
  <meta name="theme-color" content="#121212" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <a href="#" class="brand" id="brandHome"><span class="dot">●</span> AACM Recall</a>
      <ul class="tag-list" id="tagList"></ul>
      <div class="sidebar-footer">
        <button id="githubStatus" class="github-status"></button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="Search your knowledge..." />
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="filterBtn" title="Filtros">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M7 12h10M10 19h4"/></svg>
        </button>
        <button class="icon-btn" id="sortBtn" title="Ordenar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h12M3 12h8M3 17h4M17 4v16m0 0 4-4m-4 4-4-4"/></svg>
        </button>
        <button class="btn-add" id="addBtn">+ Add</button>
      </div>

      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
